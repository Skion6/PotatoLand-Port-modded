<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PotatoLand</title>
<style>
html,body{margin:0;height:100%;background:#14110c;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="f" allow="fullscreen; autoplay; gamepad; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>
<script>
// Addresses tried at the same time; the first one that answers is shown.
var SITES = [
  "https://bing.com","
];
function probe(u) {
  var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 6000);
  return fetch(u + "favicon.png?t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: c.signal })
    .then(function () { clearTimeout(t); return u; });
}
function first(ps) {
  return new Promise(function (res, rej) {
    var n = ps.length;
    ps.forEach(function (p) { p.then(res, function () { if (--n === 0) rej(); }); });
  });
}
first(SITES.map(probe)).catch(function () { return SITES[0]; }).then(function (u) {
  document.getElementById("f").src = u;
});
</script>
</body>
</html>
